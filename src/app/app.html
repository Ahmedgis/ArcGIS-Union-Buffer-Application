<div class="app-container">
  <!-- Map Container -->
  <div #mapContainer class="map-container"></div>

  <!-- Toolbar -->
  <div class="toolbar">
    <button 
      class="btn" 
      [class.btn-primary]="!isDrawMode" 
      [class.btn-active]="isDrawMode"
      (click)="toggleDrawMode()"
    >
      {{ isDrawMode ? 'Drawing Active' : 'Enable Draw' }}
    </button>
    <button 
      *ngIf="isDrawMode"
      class="btn btn-danger"
      (click)="toggleDrawMode()"
    >
      Disable Draw
    </button>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>Buffered Points</h2>
    </div>

    <div class="point-list">
      <div *ngIf="points.length === 0" class="empty-state">
        <p>No points added yet.</p>
        <p>Enable draw mode and click on the map.</p>
      </div>

      <div *ngFor="let item of points; trackBy: trackById" class="point-row">
        <div class="point-header">
          <span class="point-id">Point #{{ item.id }}</span>
          <button class="delete-btn" (click)="deletePoint(item.id)">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
              <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/>
              <path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/>
            </svg>
          </button>
        </div>
        
        <div class="input-group">
          <label>Radius (m):</label>
          <input 
            type="number" 
            [(ngModel)]="item.radius" 
            (ngModelChange)="onRadiusChange()"
            min="100" 
            max="100000"
            step="100"
          >
        </div>
      </div>
    </div>
  </div>
</div>
